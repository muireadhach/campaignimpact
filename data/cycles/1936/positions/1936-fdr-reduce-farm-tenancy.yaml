evidence_quality: A
title: A definite reduction of farm tenancy; refinance farm debt at low rates over long terms
solution: Federal cooperation in refinancing farm indebtedness at the lowest possible interest over long terms,
  and a program to reduce tenancy.
rationale: The platform 'recognize[d] the gravity of the evils of farm tenancy.'
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: We recognize the gravity of the evils of farm tenancy, and we pledge the full cooperation of the Government
    in the refinancing of farm indebtedness at the lowest possible rates of interest and over a long term of years.
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: We will persist in successful action for better land use, for reforestation, for the conservation of water
    all the way from its source to the sea, for drought and flood control, for better marketing facilities for farm
    commodities, for a definite reduction of farm tenancy, for encouragement of farmer cooperatives, for crop insurance
    and a stable food supply.
