title: 'The Good Neighbor: no armed intervention, no territorial expansion, reduction of armaments'
solution: Continue the non-intervention convention, the abandoned Platt Amendment and withdrawn marines; seek an
  inter-American peace machinery at Buenos Aires in December 1936.
rationale: '''We seek to dominate no other Nation. We ask no territorial expansion. We oppose imperialism.'''
