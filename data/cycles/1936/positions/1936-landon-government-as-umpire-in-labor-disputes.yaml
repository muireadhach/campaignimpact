title: Government as umpire and mediator; develop conciliation instead of rushing disputes to the President's doorstep
solution: Keep government in the position of umpire protecting the public interest and mediating between groups;
  build effective conciliation machinery.
rationale: '''Taking a dispute, after it gets into a tangle, and rushing it to the doorstep of the President is
  a bad way to handle a labor situation.'''
statements:
- date: '1936-07-23'
  venue: Acceptance address, Topeka
  phase: convention
  doc: app-address-accepting-the-republican-presidential-nomination-topeka-kansas
  quote: 'The Government must maintain itself in the position of an umpire: First, to protect the public interest,
    and second, to act as a mediator between conflicting groups. One of the greatest problems of this country is
    to develop effective methods of conciliation.'
