title: Continue help for young people to obtain an education and a chance to use it
solution: Continue the NYA and CCC programs that keep youth in school and give constructive occupation.
rationale: Twelve years of neglect 'had closed' the door of opportunity.
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: We have aided youth to stay in school; given them constructive occupation; opened the door to opportunity
    which 12 years of Republican neglect had closed.
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: Of course we will continue our efforts for young men and women so that they may obtain an education and
    an opportunity to put it to use.
