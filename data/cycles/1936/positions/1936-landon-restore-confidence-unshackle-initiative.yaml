title: 'Restore confidence by ''unshackling initiative'': steady, open, non-partisan administration that stops ''fumbling
  with recovery'''
solution: 'Replace uncertainty with a steady hand: make policies public, use the best talent irrespective of party,
  stop ''spending for spending''s sake'' and government competition with private payrolls.'
rationale: The small business man 'lacks confidence in the soundness of Federal policy; he is afraid of what may
  come next'; 'there can be no confidence while this administration remains In power.'
statements:
- date: '1936-07-23'
  venue: Acceptance address, Topeka
  phase: convention
  doc: app-address-accepting-the-republican-presidential-nomination-topeka-kansas
  quote: The time has come to stop this fumbling with recovery. American initiative is not a commodity to be delivered
    in pound packages through a Governmental bureau. It is a vital force in the life of our nation and it must be
    freed!
- date: '1936-06-11'
  venue: Republican National Convention, Cleveland (platform)
  phase: convention
  attribution: party_platform
  doc: app-republican-party-platform-1936
  quote: Withdrawal of government from competition with private payrolls.
- date: '1936-10-29'
  venue: Madison Square Garden, New York (Evening Star text)
  phase: general
  doc: loc-sn83045462-1936-10-30-ed1-p41
  quote: As Chief Executive I Intend to follow a course that will restore confidence. I intend to be open and above
    board on the policies of my administration.
