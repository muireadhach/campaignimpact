title: Refinance farm mortgages through the Frazier-Lemke plan (government-issued credit at low interest)
solution: 'The ''inflationary farm mortgage bill'' Lemke authored: federal refinancing of farm debt with currency
  issued for the purpose, blocked by the administration and the House in 1936.'
rationale: Bitterness over the administration's opposition to the refinance bill was widely taken as Lemke's motive
  for the Union candidacy.
notes: The Union Party's platform text is not in the archive; positions rest on contemporary reports and Coughlin's
  broadcasts.
