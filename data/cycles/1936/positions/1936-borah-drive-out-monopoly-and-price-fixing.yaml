title: Drive monopoly and price fixing out of the system or face governmental regimentation
solution: Break the 'monopoly ridden, price-fixing system' that gives 'a scanty meagre living for the vast majority
  and almost Incalculable wealth for the few'; wrest the party from the utilities, the du Ponts and the eastern
  organization that defend it.
rationale: Under either 'the reign of monopoly or the reign of governmental regimentation, the free American citizens
  ... will disappear as certainly as the free citizens disappeared in Germany and Italy.'
