title: Continue the Civilian Conservation Corps, add education fitting enrollees for private jobs, and take the
  politicians out of its administration
solution: Keep the CCC as a tide-over, not a permanent occupation; add educational programs and advancement on merit
  for 'the C. C. C. boys themselves.'
rationale: The administration 'has forgotten the original purpose of the C. C. C.' and 'is threatening to lead ...
  the corps down a blind alley.'
