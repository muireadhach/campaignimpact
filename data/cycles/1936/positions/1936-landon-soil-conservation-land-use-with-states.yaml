title: Real soil conservation and a national land-use and flood-prevention program run with the States and 'out
  of politics'
solution: Cash payments for actual conservation performance where farmers cannot afford it, State participation
  with local administration by farmers, linked to water conservation and flood control, without penalizing dairy
  and livestock producers.
rationale: '''The wealth of our soil must be preserved''; Kansas had already linked soil and water conservation
  into one program.'
