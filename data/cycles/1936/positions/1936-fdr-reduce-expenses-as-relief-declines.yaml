title: Reduce the expenses of government as relief needs decline
solution: Let expenditures fall with unemployment so an increasing share is met from current revenues.
rationale: '''We are being aided therein by the recession in unemployment.'''
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: We are determined to reduce the expenses of government. We are being aided therein by the recession in
    unemployment. As the requirements of relief decline and national income advances, an increasing percentage of
    Federal expenditures can and will be met from current revenues
- date: '1936-10-14'
  venue: Chicago
  phase: general
  doc: app-address-chicago-ill
  quote: Government expenditures are coming down and Government income is going up. The opportunities for private
    enterprise will continue to expand.
