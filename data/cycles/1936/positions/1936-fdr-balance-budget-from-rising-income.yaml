title: Balance the budget within a year or two out of rising national income, without new taxes
solution: As national income rises from $38 billion (1932) toward $60 billion, receipts will cover ordinary and
  relief expenses 'within a year or two' without additional taxes; then reduce the debt.
rationale: Balancing in 1933-35 'would have been a crime'; 'we had to balance the budget of the American people
  before we could balance the budget of the national Government.'
supersedes: 1932-fdr-balanced-budget
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: Our retrenchment, tax and recovery programs thus reflect our firm determination to achieve a balanced budget
    and the reduction of the national debt at the earliest possible moment.
- date: '1936-10-01'
  venue: Forbes Field, Pittsburgh
  phase: general
  doc: app-address-forbes-field-pittsburgh-pa
  quote: If it keeps on rising at the present rate, as I am confident that it will, the receipts of the Government,
    without imposing any additional taxes, will, within a year or two, be sufficient to care for all ordinary and
    relief expenses of the Government--in other words, to balance the budget.
- date: '1936-10-21'
  venue: Worcester, Massachusetts
  phase: general
  doc: app-address-worcester-mass
  quote: New or increased taxes are not needed to enable us to balance the Federal Budget and to begin very soon
    a rapid reduction in the national debt. Recovery is with us. Federal revenues are increasing; emergency expenditures
    are decreasing. A balanced budget is on the way.
