title: '''I welcome their hatred'': a second term in which organized money meets its master'
solution: 'A posture, not a program: the forces of ''business and financial monopoly, speculation, reckless banking''
  will be mastered in the second administration.'
rationale: '''Government by organized money is just as dangerous as Government by organized mob.'''
statements:
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: Never before in all our history have these forces been so united against one candidate as they stand today.
    They are unanimous in their hate for me--and I welcome their hatred.
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: I should like to have it said of my first Administration that in it the forces of selfishness and of lust
    for power met their match. I should like to have it said of my second Administration that in it these forces
    met their master.
