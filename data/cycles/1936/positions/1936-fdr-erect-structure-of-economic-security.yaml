title: Build on the Social Security Act toward economic security for all
solution: 'Keep and extend the 1935 Act: old-age insurance, unemployment insurance, aid to the crippled, blind and
  mothers, with benefits rising as national capacity grows.'
rationale: Government in a modern civilization has 'inescapable obligations' to protect the family and home; the
  Act is a foundation, not a finished structure.
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: On the foundation of the Social Security Act we are determined to erect a structure of economic security
    for all our people, making sure that this benefit shall keep step with the ever-increasing capacity of America
    to provide a high standard of living for all its citizens.
- date: '1936-06-27'
  venue: Acceptance address, Franklin Field, Philadelphia
  phase: convention
  doc: app-acceptance-speech-for-the-renomination-for-the-presidency-philadelphia-pa
  quote: The brave and clear platform adopted by this Convention, to which I heartily subscribe, sets forth that
    Government in a modern civilization has certain inescapable obligations to its citizens, among which are protection
    of the family and the home, the establishment of a democracy of opportunity, and aid to those overtaken by disaster.
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: Of course we will continue our help for the crippled, for the blind, for the mothers, our insurance for
    the unemployed, our security for the aged.
