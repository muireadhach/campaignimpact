title: Leave unemployment insurance to State experiment; no federal tax to compel it
solution: Encourage 'honest and practical' State unemployment insurance laws; repeal the federal payroll-tax device
  that forces States to adopt systems.
rationale: '''For the Federal Government to step in and to use its taxing power to compel all of the States immediately
  to enact unemployment insurance statutes is something unheard of.'''
