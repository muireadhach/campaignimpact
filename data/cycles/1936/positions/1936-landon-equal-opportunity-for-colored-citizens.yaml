  attribution: party_platform
  doc: app-republican-party-platform-1936
  quote: We favor equal opportunity for our colored citizens. We pledge our protection of their economic status
    and personal safety. We will do our best to further their employment in the gainfully occupied life of America,
    particularly in private industry, agriculture, emergency agencies and the Civil Service.
