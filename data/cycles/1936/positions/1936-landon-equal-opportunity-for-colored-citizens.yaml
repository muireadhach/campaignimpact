title: 'Equal opportunity for colored citizens: protect their economic status and personal safety; further their
  employment'
solution: Employment in private industry, agriculture, emergency agencies and the civil service; protection of personal
  safety.
rationale: New Deal policies 'would regiment and ultimately eliminate the colored citizen from the country's productive
  life.'
notes: The platform's 'personal safety' clause was read as an anti-lynching gesture; Landon did not campaign on
  it, and Borah attacked the party's anti-lynching promises as hypocritical.
statements:
- date: '1936-06-11'
  venue: Republican National Convention, Cleveland (platform)
