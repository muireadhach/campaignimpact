title: Recovery came from raising purchasing power at the bottom, not 'trickle down'
solution: Claim credit for recovery and keep the policy of tackling 'the problems of those who were at the bottom
  of the economic pyramid.'
rationale: The 'trickle down' theory 'was that there was always too little left to trickle down more than halfway.'
statements:
- date: '1936-10-16'
  venue: Cleveland, Ohio
  phase: general
  doc: app-address-cleveland-ohio
  quote: Our theory for the last three and a half years has been just the opposite. We have acted on the conviction
    that the way to bring about recovery was to tackle the problems of those who were at the bottom of the economic
    pyramid, to increase earnings and income, and through them the purchasing power of everybody.
- date: '1936-10-14'
  venue: Chicago
  phase: general
  doc: app-address-chicago-ill
  quote: Some people say that all this recovery has just happened. But in a complicated modern world recoveries
    from depressions do not just happen.
