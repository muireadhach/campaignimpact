cycle: 1936
candidate: franklin-d-roosevelt
issue: unemployment-relief
categories:
- relief
kind: pledge_forward
commitment_strength: directional_stance
attribution: candidate_direct
evidence_quality: A
title: Provide useful work at prevailing wages for the needy unemployed rather than a dole
solution: Continue WPA-style work relief in cooperation with State and local governments where private industry
  fails to supply jobs; refuse to 'purge the rolls by starvation.'
rationale: Maximum employment in private industry is the first objective, but unemployment is 'a national problem'
  and 'an inescapable obligation of our Government.'
supersedes: 1932-fdr-federal-relief-leadership
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: Where business fails to supply such employment, we believe that work at prevailing wages should be provided
    in cooperation with State and local governments on useful public projects
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: Of course we will provide useful work for the needy unemployed; we prefer useful work to the pauperism
    of a dole.
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: Your Government is still on the same side of the street with the Good Samaritan and not with those who
    pass by on the other side.
