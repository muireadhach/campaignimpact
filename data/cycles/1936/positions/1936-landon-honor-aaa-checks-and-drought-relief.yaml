title: Pay every outstanding AAA check and continue drought relief checks and seed loans
solution: Fulfill all obligations the administration made with farmers who carried out their end; continue relief
  checks, seed loans and other aid to drought-hit farmers until they can raise a crop, 'promptly' and without politics.
rationale: '''We will not allow needless suffering in this country--either on our farms or in our cities.'''
