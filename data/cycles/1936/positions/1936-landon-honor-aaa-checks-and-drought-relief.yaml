  quote: If I am elected, I shall fulfill all outstand ing obligations made by the present administration with the
    American farmer. By this I mean that those who have carried out their end of the bargain will receive the checks
    due them.
- date: '1936-09-22'
  venue: Des Moines, Iowa (Evening Star text)
