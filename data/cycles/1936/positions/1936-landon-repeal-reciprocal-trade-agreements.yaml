title: Repeal the Reciprocal Trade Agreements Act; return treaty power to the Senate and tariff-making to Congress
solution: Repeal the 1934 Act as 'futile and dangerous', restore the flexible tariff and Tariff Commission, and
  require that trade treaties be ratified by the Senate or tariff changes enacted by Congress.
rationale: Under eight agreements farm imports rose 84 percent against a 26 percent rise in exports -- 'charity
  paid for by American producers', not reciprocity.
notes: Landon said in the same speech he was 'opposed to a policy of isolation' and pledged 'to do all in our power'
  to revive foreign trade by other means.
statements:
- date: '1936-06-11'
  venue: Republican National Convention, Cleveland (platform)
  phase: convention
  attribution: party_platform
  doc: app-republican-party-platform-1936
  quote: We will repeal the present Reciprocal Trade Agreement Law. It is futile and dangerous. Its effect on agriculture
    and industry has been destructive. Its continuation would work to the detriment of the wage earner and the farmer.
- date: '1936-06-11'
  venue: Republican National Convention, Cleveland (platform)
  phase: convention
  attribution: party_platform
  doc: app-republican-party-platform-1936
  quote: We condemn the secret negotiations of reciprocal trade treaties without public hearing or legislative approval.
