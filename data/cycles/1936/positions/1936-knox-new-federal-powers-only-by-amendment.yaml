title: New federal activities only when legalized by constitutional amendment -- 'the horse and buggy method'
solution: Accept that changing conditions call for increased federal activity, but insist every new activity be
  authorized by amendment, not by laws that 'flout the Constitution.'
rationale: The party 'disapproves a philosophy that laughs at the horse and-buggy method and wants to use only the
  buggy whip.'
statements:
- date: '1936-07-30'
  venue: Vice-presidential acceptance, Chicago (Evening Star text)
  phase: convention
  doc: loc-sn83045462-1936-07-31-ed1-p8
  quote: But It always in sists that such new activities shall be legalized by proper constitutional amendment.
    It always will.
- date: '1936-07-30'
  venue: Vice-presidential acceptance, Chicago (Evening Star text)
  phase: convention
  doc: loc-sn83045462-1936-07-31-ed1-p8
  quote: And whatever measures the Republican administration may urge upon Con gress, not one will flout the Con
    stitution of the United States. Not one will violate the obligation of contracts. Not one will break a promise.
