evidence_quality: A
title: Use the full power of the federal government to break up private monopolies and enforce the antitrust laws
  'without fear or favor'
solution: Vigorous criminal and civil enforcement plus new legislation to make private monopoly impossible; restore
  a free competitive system instead of NRA-style government-sanctioned price fixing.
rationale: '''A private monopoly is indefensible and intolerable''; the NRA ''gave the sanction of Government to
  private monopoly'' while ''a little New Jersey pants presser went to jail.'''
statements:
- date: '1936-06-11'
  venue: Republican National Convention, Cleveland (platform)
  phase: convention
  attribution: party_platform
  doc: app-republican-party-platform-1936
  quote: We will employ the full powers of the government to the end that monopoly shall be eliminated and that
    free enterprise shall be fully restored and maintained.
- date: '1936-07-23'
  venue: Acceptance address, Topeka
  phase: convention
  doc: app-address-accepting-the-republican-presidential-nomination-topeka-kansas
  quote: We propose to use the full power of the Federal Government to break up private monopolies and to eliminate
    private monopolistic practices.
- date: '1936-10-29'
  venue: Madison Square Garden, New York (Evening Star text)
  phase: general
  doc: loc-sn83045462-1936-10-30-ed1-p41
  quote: And while I am President I intend to see that the anti-trust laws are strengthened and en forced without
    fear or favor.
