evidence_quality: A
title: Relief will continue, but purged of politics, administered locally on merit, with economies taken from 'the
  political exploiters'
solution: Federal grants-in-aid to States while need exists, relief run by non-political local agencies, staff chosen
  on merit, public works separated from relief; nobody in need to go without.
rationale: '''There is no future on the relief rolls''; the question ''is how much waste the American people are
  willing to stand for in the administration of relief.'''
statements:
- date: '1936-06-11'
  venue: Republican National Convention, Cleveland (platform)
  phase: convention
  attribution: party_platform
  doc: app-republican-party-platform-1936
  quote: The return of responsibility for relief administration to non-political local agencies familiar with community
    problems.
- date: '1936-07-23'
  venue: Acceptance address, Topeka
  phase: convention
  doc: app-address-accepting-the-republican-presidential-nomination-topeka-kansas
  quote: Let me emphasize that, while we propose to follow a policy of economy in Government expenditures, those
    who need relief will get it. We will not take our economies out of the allotments to the unemployed. We will
    take them out of the hides of the political exploiters.
- date: '1936-07-23'
  venue: Acceptance address, Topeka
  phase: convention
  doc: app-address-accepting-the-republican-presidential-nomination-topeka-kansas
  quote: We would consider it base beyond words to make loyalty or service to party a condition upon which the needy
    unemployed might obtain help.
- date: '1936-10-29'
  venue: Madison Square Garden, New York (Evening Star text)
  phase: general
  doc: loc-sn83045462-1936-10-30-ed1-p41
  quote: As Chief Executive I intend to see that relief is purged of poli tics. There is ample money in this country
    to take care of those in need. When I am President they will be taken care of.
