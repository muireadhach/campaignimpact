title: Revive the NRA's principles 'by one device or another' (imputed; the President would not say)
solution: Widely understood -- from James Roosevelt's remarks and the President's Detroit statement that he was
  not through experimenting -- to intend renewed federal control of wages, hours and trade practices; the President
  answered Landon's question with 'you pay your money and you take your choice.'
rationale: '''I do not accept the conclusion of many Republican leaders that major depressions are inevitable in
  modern life. I believe it is the duty of government to bend every effort to prevent another major catastrophe.'''
notes: Recorded under the project rule that positions a candidate ran on without stating or correcting are first-class.
  The Fair Labor Standards Act (1938) was the 'other device.'
