title: Continue the reciprocal trade agreements to lower barriers against American exports
solution: Keep making executive trade agreements under the 1934 Act while protecting farmers and manufacturers against
  dumping and subsidized goods.
rationale: Trade agreements find outlets for farm and factory products and point toward eliminating the embargoes
  and quotas that are an 'economic source of war.'
statements:
- date: '1936-06-25'
  venue: Democratic National Convention, Philadelphia (platform)
  phase: convention
  attribution: party_platform
  doc: app-1936-democratic-party-platform
  quote: We shall continue to foster the increase in our foreign trade which has been achieved by this administration;
    to seek by mutual agreement the lowering of those tariff barriers, quotas and embargoes which have been raised
    against our exports of agricultural and industrial products
- date: '1936-08-14'
  venue: Chautauqua, New York
  phase: general
  doc: app-address-chautauqua-ny
  quote: We do not maintain that a more liberal international trade will stop war; but we fear that without a more
    liberal international trade, war is a natural sequence.
- date: '1936-10-31'
  venue: Madison Square Garden, New York
  phase: general
  doc: app-address-madison-square-garden-new-york-city-1
  quote: for the regulation of security issues, for reciprocal trade among nations, for the wiping out of slums.
