summary: An FTC investigation of monopolistic price-raising (Nov. 1937), the monopoly message of April 1938 that
  produced the Temporary National Economic Committee, and Thurman Arnold's Antitrust Division (1938-43), which filed
  more cases than all predecessors combined. No new statute restored the laws' 'efficacy' as the platform promised.
