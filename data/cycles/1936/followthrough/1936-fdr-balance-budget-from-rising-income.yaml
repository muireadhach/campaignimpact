  doc: app-annual-budget-message-congress
  quote: the 1938 Budget is in balance; and, except for debt reduction of $401,515,000, it will remain in balance
    even if later on there are included additional expenditures of as much as $1,537,123,000 for recovery and relief.
  effect: Claimed a balanced 1938 budget and a fully balanced 1939.
  consistent: 'yes'
