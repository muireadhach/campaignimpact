position: 1936-fdr-balance-budget-from-rising-income
verdict: broken
contested: true
summary: The January 1937 budget declared fiscal 1938 'in balance' and promised full balance in 1939; spending was
  cut in 1937. The recession that began in August 1937 collapsed revenues, and in April 1938 the President asked
  for $3 billion of new spending and lending. Deficits continued every year of the term, and rearmament ended the
  question.
