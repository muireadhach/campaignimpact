  quote: Having thus striven and failed, this Government must lose no time or effort to keep our nation from being
    drawn into the war. In my candid judgment we shall succeed in those efforts.
  effect: Arms sales on cash-and-carry to belligerents (Nov. 4, 1939).
  consistent: partly
