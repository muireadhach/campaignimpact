position: 1936-fdr-keep-out-of-war-neutrality
verdict: partial
contested: true
summary: 'The United States stayed out of war through the term. But the policy changed shape: a Spanish embargo
  (Jan. 1937), the 1937 cash-and-carry Neutrality Act, the ''quarantine'' speech (Oct. 1937), the 1938 rearmament
  message, and after September 1939 repeal of the arms embargo so that Britain and France could buy arms -- a move
  from strict neutrality toward aid short of war.'
mechanisms:
