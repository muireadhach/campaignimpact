  date: '1937-01-06'
  doc: app-annual-message-congress-1
  quote: an addition to the existing Neutrality Act to cover specific points raised by the unfortunate civil strife
    in Spain
  effect: Neutrality extended to the Spanish civil war.
  consistent: 'yes'
- type: statute
  name: Neutrality Act of 1937 (cash-and-carry)
  date: '1937-05-01'
  doc: wiki-neutrality-acts-of-the-1930s
  effect: Mandatory arms embargo; cash-and-carry for other goods.
  consistent: 'yes'
- type: message
  name: '''Quarantine'' address, Chicago'
  date: '1937-10-05'
  doc: app-address-chicago
  effect: Suggested collective 'quarantine' of aggressors; retreated under criticism.
  consistent: partly
- type: message
  name: Message recommending increased defense appropriations
  date: '1938-01-28'
  doc: app-message-congress-recommending-increased-defense-appropriations
  quote: our national defense is, in the light of the increasing armaments of other Nations, inadequate for purposes
    of national security and requires increase for that reason.
  effect: Naval expansion 20 percent.
  consistent: partly
  indicators:
