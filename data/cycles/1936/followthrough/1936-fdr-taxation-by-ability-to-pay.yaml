summary: The Revenue Act of 1937 closed personal-holding-company and other loopholes after the tax-evasion message;
  but the Revenue Act of 1938 (allowed to become law without signature) cut capital-gains rates and gutted the undistributed-profits
  tax, which the 1939 Act repealed. Rates on the top brackets were not cut.
