summary: Drought relief continued through the 1936-37 winter; the Great Plains committee program (Feb. 1937), the
  water-conservation report (May 1937) and the Flood Control Act of 1938 gave the Corps of Engineers a national
  basin-by-basin program; Ohio-Mississippi flood relief followed the January 1937 flood.
