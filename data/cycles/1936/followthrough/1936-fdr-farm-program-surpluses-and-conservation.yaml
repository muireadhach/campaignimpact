summary: The Agricultural Adjustment Act of 1938 made price supports mandatory for corn, cotton and wheat, added
  marketing quotas, commodity loans, the 'ever-normal granary' storage reserve and crop insurance, financed from
  the Treasury rather than a processing tax; conservation payments continued.
