position: 1936-fdr-support-collective-bargaining
verdict: kept
contested: false
summary: The Wagner Act was upheld (NLRB v. Jones & Laughlin, April 12, 1937) and enforced through the sit-down
  wave and the CIO's organizing drives; Roosevelt refused to appoint a commission to revise it (June 1938) though
  he kept aloof from the GM sit-down.
