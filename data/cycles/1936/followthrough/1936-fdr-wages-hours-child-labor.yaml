position: 1936-fdr-wages-hours-child-labor
verdict: kept
contested: false
summary: After a year of defeats in the House, the Fair Labor Standards Act (June 25, 1938) set a 25-cent minimum
  wage rising to 40 cents, a 44-hour week falling to 40, and barred 'oppressive child labor' in goods for interstate
  commerce; the Supreme Court upheld it in Darby (1941).
mechanisms:
- type: message
  name: Message on establishing minimum wages and maximum hours
  date: '1937-05-24'
  doc: app-message-congress-establishing-minimum-wages-and-maximum-hours
  quote: All but the hopelessly reactionary will agree that to conserve our primary resources of man power, government
    must have some control over maximum hours, minimum wages, the evil of child labor and the exploitation of unorganized
    labor.
  effect: Asked Congress for a wage-hour-child-labor statute.
