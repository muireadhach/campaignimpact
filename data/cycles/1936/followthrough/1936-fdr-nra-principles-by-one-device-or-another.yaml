position: 1936-fdr-nra-principles-by-one-device-or-another
verdict: kept
contested: false
summary: 'The ''other device'' was statutory: the Fair Labor Standards Act (1938) imposed the NRA''s wage, hour
  and child-labor principles by law under the commerce power, without codes, price-fixing or antitrust exemption.
  The price-fixing side of NRA was not revived; the Guffey coal act (1937) was the one industry-code survivor.'
mechanisms:
- type: message
  name: Message on minimum wages and maximum hours
  date: '1937-05-24'
  doc: app-message-congress-establishing-minimum-wages-and-maximum-hours
  quote: A self-supporting and self-respecting democracy can plead no justification for the existence of child labor,
    no economic reason for chiseling workers' wages or stretching workers' hours.
  effect: Sought the wage-hour statute.
  consistent: 'yes'
- type: statute
  name: Fair Labor Standards Act of 1938
  date: '1938-06-25'
  doc: wiki-fair-labor-standards-act-of-1938
  effect: Wages, hours and child labor by statute.
  consistent: 'yes'
  indicators:
