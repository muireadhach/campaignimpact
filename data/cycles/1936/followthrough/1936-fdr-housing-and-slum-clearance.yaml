position: 1936-fdr-housing-and-slum-clearance
verdict: kept
contested: false
summary: The Wagner-Steagall Housing Act (Sept. 1, 1937) created the U.S. Housing Authority to subsidize local public
  housing; the November 1937 message and the 1938 FHA amendments pushed private construction, and FHA insurance
  authority was raised to $3 billion in December 1938.
mechanisms:
- type: statute
  name: United States Housing Act of 1937 (Wagner-Steagall)
  date: '1937-09-01'
  doc: wiki-housing-act-of-1937
  quote: provided for subsidies to be paid from the United States federal government to local public housing agencies
    (LHAs) to improve living conditions for low-income families.
  effect: Federal subsidies to local housing authorities.
  consistent: 'yes'
  indicators:
  - construction-contracts
- type: message
  name: Message on private construction of housing
  date: '1937-11-27'
  doc: app-message-congress-legislation-for-private-construction-housing
  quote: From the point of view of widespread and sustained economic recovery, housing constitutes the largest and
    most promising single field for private enterprise.
  effect: FHA liberalization to revive private building.
  consistent: 'yes'
  indicators:
  - construction-contracts
- type: executive_order
  name: FHA insurance authorization raised to $3 billion
  date: '1938-12-13'
  doc: app-letter-the-federal-housing-administration
  quote: I hereby approve an increase of $1,000,000,000 in the amount of outstanding principal of mortgages which
    may be insured by the Federal Housing Administration, making an aggregate of $3,000,000,000.
  effect: More mortgage insurance capacity.
  consistent: 'yes'
assessments:
- doc: wiki-housing-act-of-1937
  verdict: kept
  reasoning: Public housing for low-income families began; private construction recovered in 1939-40.
