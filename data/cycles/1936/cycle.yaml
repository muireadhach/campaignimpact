summary: A referendum on the New Deal. Roosevelt, renominated without opposition, ran on his record ('economic royalists',
  'I welcome their hatred') and a platform of continuing relief, social security, wages-and-hours and farm programs,
  while promising a balanced budget from rising national income. Landon, the only Republican governor re-elected
  in 1934, accepted a platform that pledged to preserve free enterprise and the Constitution, cut spending, repeal
  the compulsory old-age insurance plan for a pay-as-you-go pension, repeal the reciprocal trade agreements and
  continue farm cash benefits. The Union Party (Lemke, backed by Coughlin, Townsend and G. L. K. Smith) tried to
  hold the inflationist left. The Literary Digest straw poll predicted Landon; Roosevelt won 60.8% and 523 of 531
  electoral votes, carrying every state but Maine and Vermont.
