position: 1932-fdr-unemployment-insurance-state-laws
verdict: kept
contested: false
summary: Title III of the Social Security Act (August 14, 1935) created a federal payroll tax offset for state unemployment-insurance
  laws — precisely 'under state laws' with federal inducement, as the platform and the Boston speech specified.
  Farm and domestic workers were excluded.
