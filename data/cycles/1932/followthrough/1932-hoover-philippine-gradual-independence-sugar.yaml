summary: Hoover vetoed the Hawes-Cutting bill on January 13, 1933 as pledged; Congress overrode him on January 17.
  The Philippine legislature rejected that act, and the Tydings-McDuffie Act (1934) — with the same sugar quotas
  Hoover had opposed — became the independence law.
