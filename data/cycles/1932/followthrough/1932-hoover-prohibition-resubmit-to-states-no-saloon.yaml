summary: The lame-duck Congress proposed the Twenty-first Amendment on February 20, 1933 (Hoover neither signed
  nor could veto a constitutional amendment); it contained the Section 2 protection of dry states Hoover demanded
  but no anti-saloon guarantee. Ratified December 1933.
