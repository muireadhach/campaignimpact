position: 1932-fdr-utility-rates-on-actual-investment
verdict: partial
contested: false
summary: The Public Utility Holding Company Act (August 1935) put holding companies under the SEC with a 'death
  sentence' for pyramids beyond two tiers, and the Federal Power Act gave the FPC jurisdiction over interstate wholesale
  rates and required publicity of securities, contracts and interchanges. The prudent-investment rate base was not
  legislated, the bill was weakened in Congress, and the 'crime to publish false utility matter' point was never
  enacted.
