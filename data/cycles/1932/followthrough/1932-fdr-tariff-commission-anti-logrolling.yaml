summary: The 1934 Reciprocal Trade Agreements Act moved rate-making to executive negotiation, bypassing both congressional
  log-rolling and the Tariff Commission's fact-finding role; the public-counsel idea was not enacted. The flexible
  provision Hoover defended was left in place.
