position: 1932-fdr-regulate-exchanges-and-holding-companies
verdict: kept
contested: false
summary: The Securities Exchange Act (June 6, 1934) created the SEC to regulate exchanges; the Public Utility Holding
  Company Act and Federal Power Act (August 1935) reached holding companies and interstate rates; the Commodity
  Exchange Act (1936) covered commodity exchanges.
mechanisms:
- type: message
  name: Message recommending a Securities Exchange Commission
  date: '1934-02-09'
  doc: app-message-congress-recommending-securities-exchange-commission
  quote: I therefore recommend to the Congress the enactment of legislation providing for the regulation by the
    Federal Government of the operations of exchanges dealing in securities and commodities for the protection of
    investors, for the safeguarding of values, and so far as it may be possible, for the elimination of unnecessary,
    unwise and destructive speculation.
