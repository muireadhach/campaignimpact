position: 1932-fdr-federal-relief-leadership
verdict: kept
contested: false
summary: 'The Federal Emergency Relief Act (May 12, 1933) went beyond the plank: $500 million in outright grants
  to states, not loans, administered by Harry Hopkins; followed by the CWA and the WPA. ''Bold leadership in distress
  relief'' is among the most fully kept promises of the campaign.'
