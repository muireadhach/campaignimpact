position: 1932-fdr-public-works-only-a-stopgap
verdict: reversed
contested: false
summary: Within four months of taking office Roosevelt asked for $3.3 billion of public works (NIRA Title II), created
  the Civil Works Administration for the winter of 1933–34, and in 1935 the WPA. The April 1932 view that public
  works were 'only a stopgap' was abandoned in practice, though the administration never claimed they would employ
  all the unemployed.
mechanisms:
- type: message
  name: 'NIRA message: $3.3 billion public works'
  date: '1933-05-17'
  doc: app-message-congress-recommending-enactment-the-national-industrial-recovery-act
  quote: A careful survey convinces me that approximately $3,300,000,000 can be invested in useful and necessary
    public construction, and at the same time put the largest possible number of people to work.
  consistent: 'no'
- type: statute
  name: Emergency Relief Appropriation Act (WPA)
  date: '1935-04-08'
  doc: app-statement-signing-the-work-relief-bill
  effect: $4.88 billion work-relief appropriation.
  consistent: 'no'
assessments:
- doc: mc-fdr-domestic-affairs
  verdict: reversed
  reasoning: The PWA alone had a budget over $3 billion and the CWA spent nearly $1 billion in four months.
  quote: The PWA, run by Secretary of the Interior Harold Ickes, had a budget of over $3 billion.
