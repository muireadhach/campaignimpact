position: 1932-fdr-mortgage-relief-little-fellow
verdict: kept
contested: false
summary: The Emergency Farm Mortgage Act (Title II of the farm relief bill, May 12, 1933), the Farm Credit Administration
  (Executive Order 6084, March 27, 1933) and the Home Owners' Loan Act (June 13, 1933) refinanced farm and home
  mortgages at lower interest with extended terms — the Topeka and Springfield specifications almost exactly, on
  a far larger scale than the RFC loans to lenders Roosevelt had criticized.
