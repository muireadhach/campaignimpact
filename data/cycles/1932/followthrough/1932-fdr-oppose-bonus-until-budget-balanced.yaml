summary: 'Roosevelt kept the pledge personally: he cut veterans'' benefits in the Economy Act, vetoed the Patman
  bonus bill in person before a joint session (May 22, 1935) and vetoed the 1936 bill; Congress overrode the second
  veto on January 27, 1936 and $1.9 billion in bonds was paid in June 1936 with the budget still unbalanced.'
