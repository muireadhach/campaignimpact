position: 1932-fdr-equitable-income-distribution
verdict: partial
contested: true
summary: NRA codes raised minimum wages and cut hours; the Wagner Act (1935) armed unions; Social Security (1935)
  created a floor; the 1935 'wealth tax' was the first explicit redistributive measure — and Congress gutted it.
  The regressive payroll tax and continued mass unemployment limited the shift; income concentration fell substantially
  only with wartime taxation.
