position: 1932-fdr-disabled-veterans-justice
verdict: partial
contested: true
summary: 'The Economy Act (March 20, 1933) repealed all veterans'' benefit laws and let the President re-set them
  by executive order: non-service-connected benefits fell more than 40 percent, and even service-connected compensation
  was cut, before Congress restored about $90 million over Roosevelt''s veto in March 1934. ''Full justice and generosity''
  for the service-disabled was honored in principle and breached in the first year''s economies.'
