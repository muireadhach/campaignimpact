  date: '1933-03-20'
  doc: wiki-economy-act-of-1933
  quote: Its most important provisions, however, repealed all federal laws regarding veterans' benefits.
  consistent: 'no'
- type: statute
  name: Independent Offices Appropriation Act (over veto)
  date: '1934-03-28'
  doc: wiki-economy-act-of-1933
  quote: In March 1934, Congress overrode Roosevelt's veto and added another $90 million in veterans benefits and
    $120 million to federal workers' salaries.
  consistent: partly
assessments:
- doc: wiki-economy-act-of-1933
  verdict: partial
  reasoning: Cuts fell hardest on non-service-connected cases, but service-connected compensation was also reduced
    and partly restored by Congress and the courts.
  quote: Benefits for non-disabled veterans fell more than 40%, creating deep resentment among former soldiers and
    officers and leading to the establishment of the Veterans of Foreign Wars as a major force in American politics.
