summary: The TVA generated and sold power, the RFC expanded into direct lending, the NRA licensed industry and the
  AAA managed agriculture. Roosevelt described this as 'partnership,' not control; by the platform's own words the
  government entered fields of private enterprise well beyond public works and natural resources.
