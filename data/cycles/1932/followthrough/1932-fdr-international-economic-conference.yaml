position: 1932-fdr-international-economic-conference
verdict: broken
contested: true
summary: The World Monetary and Economic Conference met in London in June 1933 with an American delegation, exactly
  as pledged — and Roosevelt's July 3 'bombshell' wireless rejecting currency stabilization as 'a specious fallacy'
  destroyed it. The 1936 Tripartite Agreement with Britain and France partly repaired the damage.
mechanisms:
- type: message
  name: Wireless to the London Conference (the 'bombshell')
  date: '1933-07-03'
  doc: app-wireless-the-london-conference
  effect: Refused any stabilization agreement; the conference broke up.
  consistent: 'no'
- type: treaty
  name: Tripartite Monetary Agreement
  date: '1936-09-25'
  doc: mc-fdr-foreign-affairs
  effect: Informal exchange-rate cooperation with Britain and France.
  consistent: partly
assessments:
- doc: mc-fdr-foreign-affairs
  verdict: broken
  reasoning: Roosevelt scuttled the conference he had promised to lead, then reversed course in 1936.
  quote: Roosevelt soon recognized his mistake and his administration worked with England and France to stabilize
    the international economic system, negotiating monetary agreements with those nations in 1936.
