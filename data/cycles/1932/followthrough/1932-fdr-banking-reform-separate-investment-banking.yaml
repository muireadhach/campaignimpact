position: 1932-fdr-banking-reform-separate-investment-banking
verdict: kept
contested: false
summary: The Banking Act of June 16, 1933 (Glass-Steagall) separated commercial from investment banking, restricted
  Federal Reserve credit for speculation and created the FDIC (not a campaign promise; Roosevelt initially opposed
  deposit insurance). A Deposit Liquidation Board (October 1933) sped payouts from closed banks.
