position: 1932-fdr-shorter-hours
verdict: kept
contested: false
summary: NRA codes imposed maximum hours (typically 40) across industry from mid-1933 until Schechter voided them
  in May 1935; the Walsh-Healey Act (1936) set hours on government contracts; the Fair Labor Standards Act (1938)
  made the 40-hour week permanent law.
mechanisms:
- type: statute
  name: National Industrial Recovery Act — code hours
  date: '1933-06-16'
  doc: app-message-congress-recommending-enactment-the-national-industrial-recovery-act
  quote: My FIRST request is that the Congress provide for the machinery necessary for a great cooperative movement
    throughout all industry in order to obtain wide reemployment, to shorten the working week, to pay a decent wage
    for the shorter week and to prevent unfair competition and disastrous overproduction.
  consistent: 'yes'
assessments:
- doc: mc-fdr-domestic-affairs
  verdict: kept
  reasoning: Codes regulated hours until the Court struck the NIRA; the policy was re-enacted later.
  quote: In the May 1935 Schechter decision, the Court invalidated the NIRA on the grounds that Congress had improperly
    delegated its powers to the Executive and that it unconstitutionally interfered with intra-state commerce.
obstruction:
  reasons:
  - courts
  explanation: Schechter (1935) interrupted the code system until the FLSA (1938).
  doc: mc-fdr-domestic-affairs
provenance:
  created_by: claude-fable-5-1
  created_at: '2026-09-13'
  review_status: unreviewed
