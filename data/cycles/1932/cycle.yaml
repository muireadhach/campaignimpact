year: 1932
election_date: 1932-11-08
winner: franklin-d-roosevelt
context_events: [great-depression, bank-panic-1930-33, smoot-hawley, bonus-army, prohibition-era, ww1-war-debts, manchuria-1931, dust-bowl]
summary: >
  Fought in the third year of the Depression with unemployment near 25%. Hoover ran on his record
  (RFC, moratorium, public works, tariff) and warned that Roosevelt's program would deepen the collapse;
  Roosevelt ran on a "new deal" whose specifics were deliberately elastic, combining orthodox pledges
  (balanced budget, sound currency, 25% spending cut) with promises of relief, farm price support,
  public power, securities regulation and repeal. Roosevelt won 472–59 in the Electoral College and 57.4%
  of the popular vote; Norman Thomas polled 2.2%.
