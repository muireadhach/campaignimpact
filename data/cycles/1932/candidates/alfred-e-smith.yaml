party: Democratic
tier: contender
result: Lost nomination; won Massachusetts, Rhode Island, New Hampshire (split) and Connecticut/New Jersey delegations; 201.75 first-ballot votes vs Roosevelt's 666.25
summary: >
  The 1928 nominee entered in February 1932 to block his former protégé. Won Massachusetts (April 26)
  and Rhode Island, ran strongly in Pennsylvania and New Jersey, and led the "Stop Roosevelt" coalition
  at Chicago. Declared war on "demagogic" appeals at the April 13 Jefferson Day dinner and campaigned as
  a wet, pro-business Democrat with a distinctive war-debts plan. Refused to move to make the nomination unanimous.
