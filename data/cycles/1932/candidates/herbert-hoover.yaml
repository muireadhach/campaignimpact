party: Republican
tier: nominee
result: Lost; 59 electoral votes, 39.7% popular vote
popular_vote_pct: 39.7
electoral_vote: 59
summary: >
  Renominated on the first ballot at Chicago in June. Initially planned a limited campaign from the White House
  ("Statement on Campaign Plans," June 18); by October, alarmed by the polls, made nine major addresses,
  defending his anti-Depression record and arguing that the Democratic program (tariff reduction, currency
  tinkering, spending) would deepen the crisis. Only the Northeast and a few small states stayed with him.
