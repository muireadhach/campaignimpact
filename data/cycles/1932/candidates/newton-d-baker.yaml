party: Democratic
tier: contender
result: Never formally a candidate; 8.5 first-ballot votes; the consensus second choice if the convention deadlocked
summary: >
  The dark horse of 1932. Did not enter primaries but was the preferred fallback of Smith, Ritchie and
  Garner delegates and of much of the press; Walter Lippmann promoted him. Positions are mostly
  imputed from his Wilsonian record: pro-League of Nations (which he publicly softened in early 1932),
  pro-utility-industry, and internationalist on debts and trade.
sources: [wiki-1932-democratic-national-convention, wiki-1932-democratic-party-presidential-primaries]
