party: Democratic
tier: contender
result: Lost nomination; won California and Texas primaries; 90.25 first-ballot votes; released delegates to Roosevelt on the fourth ballot and became the vice-presidential nominee
summary: >
  Speaker of the House, promoted by William Randolph Hearst as an "America first" alternative to the
  internationalist Roosevelt, Smith and Baker. Beat Roosevelt in the California primary (May 3) with
  Hearst and McAdoo support. Ran almost no personal campaign and issued few statements; his positions
  are substantially those of his House record and of Hearst's press.
