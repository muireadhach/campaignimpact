title: Reorganize the Department of Agriculture as the machinery for national agricultural planning
solution: >
  Reorganize the USDA to cut unnecessary functions and useless jobs and redirect it toward "a program of
  national planning" in agriculture, replacing "heterogeneous and disassociated" agency efforts.
rationale: >
  Departmental growth has been "irregular, illogical and haphazard"; farm policy needs "unity of planning,
  coherence in our Administration and emphasis upon cures rather than upon drugs."
