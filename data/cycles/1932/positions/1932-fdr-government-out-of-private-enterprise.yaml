title: Remove government from private enterprise except public works and natural resources
solution: 'Government to withdraw from all fields of private enterprise, with the exception of developing public
  works and natural resources in the common interest.

  '
rationale: Limited-government orthodoxy; aimed at the Farm Board and Hoover-era interventions.
notes: 'Sits uneasily with the same platform''s public-power and regulatory planks and with the candidate''s planning
  rhetoric; a useful test case for contradiction queries.

  '
statements:
- date: 1932-06-27
  venue: Democratic National Convention, Chicago (platform)
  phase: convention
  attribution: party_platform
  doc: app-1932-democratic-party-platform
  quote: The removal of government from all fields of private enterprise except where necessary to develop public
    works and natural resources in the common interest.
- date: 1932-07-02
  venue: Acceptance address, Democratic National Convention, Chicago
  phase: convention
  attribution: candidate_direct
  doc: app-address-accepting-the-presidential-nomination-the-democratic-national-convention-chicago-1
  quote: That admirable document, the platform which you have adopted, is clear. I accept it 100 percent.
  note: Blanket endorsement of every plank.
- date: '1932-10-19'
  venue: Campaign address on the federal budget, Forbes Field, Pittsburgh
  phase: general
  doc: app-campaign-address-the-federal-budget-pittsburgh-pennsylvania
  quote: You cannot go very far with any real Federal economy, without a complete change of concept of what are
    the proper functions and limits of the Federal Government itself.
- date: '1932-10-19'
  venue: Campaign address on the federal budget, Forbes Field, Pittsburgh
  phase: general
  doc: app-campaign-address-the-federal-budget-pittsburgh-pennsylvania
  quote: Ever since the days of Thomas Jefferson, that has been the exact reverse of the democratic concept, which
    is to permit Washington to take from the States nothing more than is necessary to keep abreast of the march
    of our changing economic situation.
