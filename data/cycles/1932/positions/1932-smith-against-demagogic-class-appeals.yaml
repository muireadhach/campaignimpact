title: War on any candidate who makes 'demagogic appeals to the masses' setting class against class
solution: Oppose, and refuse to support, any Democratic candidate whose appeal sets 'class against class and rich
  against poor' — the 'forgotten man' politics of Roosevelt's April 7 broadcast; by implication, a campaign on repeal
  and business-friendly economics rather than redistribution.
rationale: Class appeals destroy the masses they claim to help; the party's proper ground is the constitutional
  and economic conservatism of its 1928 campaign.
notes: The 'Angry Warrior' speech. Smith's positive economic program in 1932 is documented only as 'openly-conservative
  economic policies' (Wikipedia, citing Caro); no verbatim program is archived.
