title: A more equitable distribution of national income — higher reward to labor, lower to speculative capital
solution: 'Reorient policy from the producer to the consumer; ensure all willing to work receive at least the necessities
  of life; raise the average reward for a day''s work and reduce the reward to capital, especially speculative capital.
  No mechanism specified.

  '
rationale: 'The basic trouble "was not an insufficiency of capital. It was an insufficient distribution of buying
  power coupled with an oversufficient speculation in production"; wages did not rise proportionately to returns
  to capital; an economy with surplus productive capacity cannot endure without broader purchasing power.

  '
statements:
- date: 1932-05-22
  venue: Oglethorpe University commencement, Atlanta
  phase: primary
  doc: app-address-oglethorpe-university-atlanta-georgia
  quote: Do what we may have to do to inject life into our ailing economic order, we cannot make it endure for long
    unless we can bring about a wiser, more equitable distribution of the national income.
- date: 1932-05-22
  venue: Oglethorpe University commencement, Atlanta
  phase: primary
  doc: app-address-oglethorpe-university-atlanta-georgia
  quote: In such a system, the reward for a day's work will have to be greater, on the average, than it has been,
    and the reward to capital, especially capital which is speculative, will have to be less.
- date: '1932-10-31'
  venue: Campaign address on unemployment, Boston Arena
  phase: general
  doc: app-campaign-address-program-for-unemployment-and-long-range-planning-boston-massachusetts
  quote: There is one final objective of my policy which is more vital and more basic than all else. I seek to restore
    the purchasing power of the American people. The return of that purchasing power, and only that, will put America
    back to work.
