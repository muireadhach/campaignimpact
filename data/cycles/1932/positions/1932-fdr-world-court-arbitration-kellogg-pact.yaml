title: Adhere to the World Court; arbitration of disputes; consultation to enforce the Kellogg-Briand Pact
solution: >
  Adherence to the World Court with the pending Senate reservations; settlement of international disputes by
  arbitration; make the Pact of Paris effective by consultation and conference when treaty violations are
  threatened; sanctity of treaties; no interference in other nations' internal affairs.
rationale: Wilsonian internationalism minus the League, which Roosevelt had disavowed in February 1932.
