title: A twenty-year moratorium on the war debts, writing them off in proportion to each nation's purchases of American
  goods
solution: Suspend intergovernmental debt payments for twenty years and cancel debt in proportion to the debtor's
  trade with the United States — converting the debts into an instrument for reviving exports.
rationale: Debts cannot be collected while trade is dead; linking write-offs to purchases makes Europe pay in American
  goods and jobs.
notes: Verbatim text of the speech is not archived; the Evening Star's front-page report (April 14, 1932) is the
  source. The proposal directly contradicted the platform plank against cancellation adopted two months later.
