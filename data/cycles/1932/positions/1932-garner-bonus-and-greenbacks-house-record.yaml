title: The Patman cash bonus and $2.3 billion of greenbacks, passed by the House under his speakership
solution: The House under Speaker Garner passed the Patman bill (June 15, 1932) paying the bonus in full immediately,
  financed by new Treasury notes; Hoover treated this as Garner's and the party's policy.
rationale: Immediate purchasing power for veterans; currency expansion to fight deflation.
notes: Garner's personal vote and views on the Patman bill are not archived; Hoover's attribution rests on his role
  as Speaker. Neither Garner nor Roosevelt disavowed the bill during the campaign.
