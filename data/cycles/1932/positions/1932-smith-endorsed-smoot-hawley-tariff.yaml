title: Endorsement of the Smoot-Hawley tariff
solution: Accept the 1930 tariff rather than campaign against it — the position Raskob tried to write into party
  policy in March 1931.
rationale: Protection appealed to the Northeastern industrial Democrats Smith relied on; opposing it would alienate
  them.
notes: Documented only in secondary summary; the original endorsement (1931) is not archived.
