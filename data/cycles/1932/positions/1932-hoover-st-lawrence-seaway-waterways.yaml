title: Ratify the St. Lawrence seaway treaty and complete the inland waterway system
solution: Secure Senate ratification of the July 1932 treaty with Canada and build the Great Lakes–St. Lawrence
  seaway, 'the greatest public improvement ever undertaken upon our continent'; continue the Mississippi and inland
  waterway program already doubled in pace.
rationale: Gives the Midwest access to world markets and employs men; a 1928 pledge now delivered.
statements:
- date: '1932-08-11'
  venue: Address accepting the Republican nomination, Constitution Hall, Washington
  phase: general
  doc: app-address-accepting-the-republican-presidential-nomination
  quote: After 20 years of discussion between the United States and our great neighbor to the north, I have signed
    a treaty for the construction of the Great Lakes-St. Lawrence seaway.
- date: '1932-08-11'
  venue: Address accepting the Republican nomination, Constitution Hall, Washington
  phase: general
  doc: app-address-accepting-the-republican-presidential-nomination
  quote: We shall undertake this great seaway, the greatest public improvement ever undertaken upon our continent,
    with its consequent employment of men as quickly as that treaty can be ratified.
- date: '1932-06-14'
  venue: Republican National Convention, Chicago (platform)
  phase: convention
  doc: app-republican-party-platform-1932
  quote: Recognizing the inestimable benefits which will accrue to the nation from placing the ports of the Great
    Lakes on an ocean base, the party reaffirms allegiance to this great project and pledges its best efforts to
    secure its early completion.
  attribution: party_platform
