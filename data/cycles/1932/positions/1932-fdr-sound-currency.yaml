evidence_quality: A
title: A sound currency preserved at all hazards
solution: >
  Preserve a sound currency "at all hazards" and call an international monetary conference to consider
  the rehabilitation of silver and related questions. Reverse the Republican "inflation" used to fund deficits.
rationale: >
  Muddled government finance creates uncertainty about currency values that spreads internationally;
  "sound money is an international necessity."
notes: >
  Read against 1932-fdr-restore-commodity-price-level. The campaign never defined "sound currency" as the
  gold standard in so many words; Hoover's charge that Roosevelt intended to leave gold was not answered directly.
statements:
