title: Compulsory unemployment insurance funded by employers and by higher income and inheritance taxes
solution: An effective system of compulsory unemployment insurance with funds partly contributed by employers and
  partly raised from increased income and inheritance taxes (the convention debated insurance versus compensation
  and the funding basis).
rationale: When work is cut off through no fault of the worker, 'the government is under a moral duty to provide
  him with the minimum requirements of life.'
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
