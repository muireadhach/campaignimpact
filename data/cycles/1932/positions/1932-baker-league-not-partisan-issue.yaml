title: Do not make the League of Nations a party issue; no entry until a majority of Americans approve
solution: Having long advocated American membership in the League, Baker declared (January 26, 1932) that he would
  not favor a League plank and would not put the United States in the League until convinced a majority approved.
rationale: '''I think it would be a great mistake to make a partisan issue of the League of Nations.'' A tactical
  retreat to remain available as a compromise nominee.'
notes: Roosevelt made a parallel disavowal of the League on February 2, 1932 under Hearst pressure; both are cases
  of a candidate reversing a long-held position to become nominable.
