title: Consolidate the seven federal farm-mortgage agencies under a single purpose
solution: >
  Ask Congress for "a complete reorganization of the means provided to operate in the field of agricultural
  finance," coordinating the at least seven federal and quasi-federal agencies dealing with farm mortgages
  so federal farm-credit policy "may be guided by a single purpose."
rationale: Scattered agencies cannot be an effective aid to the farmer; policy must be concentrated in operation.
statements:
  - date: 1932-10-21
    venue: Campaign address on farm mortgages, Springfield, Illinois
    phase: general
    doc: app-campaign-address-farm-mortgages-springfield-illinois
    quote: "Finally I propose consideration by Congress of the necessity for a complete reorganization of the means provided to operate in the field of agricultural finance."
  - date: 1932-10-21
    venue: Campaign address on farm mortgages, Springfield, Illinois
    phase: general
    doc: app-campaign-address-farm-mortgages-springfield-illinois
    quote: "Within my broad agricultural program I advocate the coordination of such agencies to the end that the Federal agricultural policy in regard to farm mortgages may be guided by a single purpose and be so concentrated in its operation that it may really become an effective aid to the farmer."
