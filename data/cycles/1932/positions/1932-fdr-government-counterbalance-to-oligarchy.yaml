title: Government as a check on concentrated economic power — "individualism" redefined as equality of opportunity
solution: >
  Government, "without becoming a prying bureaucracy," to act as a check or counterbalance to the financial
  oligarchy so as to secure "the chance to work and the safety of savings"; oppose regimentation whether by
  private economic government or by the state; "equality of opportunity for all, the right of exploitation for none."
rationale: >
  Two-thirds of industry is concentrated in a few hundred corporations managed by a handful of men; fewer
  than three dozen banking houses direct the flow of capital — "the precise opposite of the individualism
  of which the President speaks."
statements:
  - date: 1932-08-20
    venue: Campaign address, Columbus, Ohio
    phase: general
    doc: app-campaign-address-columbus-ohio
    quote: "I believe that the Government, without becoming a prying bureaucracy, can act as a check or counterbalance to this oligarchy so as to secure the chance to work and the safety of savings to men and women, rather than safety of exploitation to the exploiter"
  - date: 1932-08-20
    venue: Campaign address, Columbus, Ohio
    phase: general
    doc: app-campaign-address-columbus-ohio
    quote: "we must make American individualism what it was intended to be -- equality of opportunity for all, the right of exploitation for none."
