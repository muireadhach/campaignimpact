title: States' rights and business-led recovery — no federal intervention in relief
solution: Keep relief a state, local and private responsibility; urge programs sponsored by the business community;
  refuse RFC loans (Maryland took none until mid-1933).
rationale: Federal intervention in local affairs undermines self-government; Maryland's businesslike state government
  could manage its own distress.
notes: No 1932 campaign speech by Ritchie is archived; positions are reconstructed from his gubernatorial record.
