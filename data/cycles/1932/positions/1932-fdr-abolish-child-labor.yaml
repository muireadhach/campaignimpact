evidence_quality: A
title: No return to sweatshops or children working in factories
solution: Treat the abolition of child labor and sweatshops as settled social policy; keep children in school to sixteen.
rationale: >
  Depression pushes children out of school into underpaid, dangerous work; "the use of these untrained
  children in industry keeps many adults out of employment" and cuts wages below a living standard.
statements:
  - date: 1932-10-02
    venue: Campaign address, Detroit, Michigan
    phase: general
    audience: Detroit crowd; Sunday non-partisan framing
    doc: app-campaign-address-detroit-michigan
    quote: "We cannot go back to the sweatshops of America. We cannot go back to children working in factories. Those days are gone."
  - date: 1932-10-13
    venue: Radio address on unemployment and social welfare, Albany
    phase: general
    doc: app-radio-address-unemployment-and-social-welfare-from-albany-new-york
    quote: "It is well to remember, too, that the use of these untrained children in industry keeps many adults out of employment and has the effect of cutting down wages below a decent living standard."
