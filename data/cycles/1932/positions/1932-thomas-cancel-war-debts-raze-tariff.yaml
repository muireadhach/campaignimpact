title: Cancel the war debts (against cancellation of reparations) and raze the tariff wall
solution: Cancel all war debts of foreign governments conditional on cancellation of reparations; 'the razing of
  the dangerous and preposterous tariff wall.'
rationale: The debts 'can never be collected from the bankrupt or semibankrupt countries of Europe'; insistence
  'prolongs the economic uncertainty which paralyzes Europe.'
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
