title: Non-interference in other nations' affairs and cooperation with Western Hemisphere nations
solution: >
  No interference in the internal affairs of other nations; cooperate with the nations of the Western
  Hemisphere to maintain "the spirit of the Monroe Doctrine" (i.e., collectively rather than unilaterally).
rationale: Reaction against the interventions of the 1910s–20s (Nicaragua, Haiti); precursor of the Good Neighbor policy.
