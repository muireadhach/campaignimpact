title: Full justice and generosity for veterans disabled by actual wartime service — silence on the bonus
solution: >
  Justice and generosity for war veterans "who have suffered disability or disease caused by or resulting
  from actual service in time of war" and their dependents. The platform and candidate say nothing about
  immediate cash payment of the adjusted-service bonus.
rationale: >
  The "actual service" qualifier tracks the Economy-in-government position: benefits for service-connected
  disability, not for the non-service-connected pensions enacted in 1930.
notes: The bonus silence is deliberate; see reception records for how veterans' groups and Hoover read it.
