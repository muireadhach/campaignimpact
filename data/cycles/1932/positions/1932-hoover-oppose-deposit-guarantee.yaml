title: Oppose a federal guarantee of bank deposits
solution: List 'the guarantee of bank deposits' among the Democratic House measures the party contrasts with its
  own program; rely instead on stronger supervision and RFC support.
rationale: Deposit guarantees are grouped with fiat currency and price manipulation as unsound expedients.
notes: Neither Roosevelt nor the Democratic platform endorsed deposit insurance; the House Steagall bill of 1932
  did. The FDIC (June 1933) was a congressional initiative Roosevelt initially resisted.
