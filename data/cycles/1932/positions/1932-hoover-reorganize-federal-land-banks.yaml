title: Reorganize and enlarge the Federal Land Banks to refinance farm mortgages; curb Joint Stock Land Bank abuses
solution: Propose to Congress at the next session a further reorganization of the Federal Land Banks with 'resources
  and liberty of action' to expand farm-mortgage refinancing; remedy the organization of the Joint Stock Land Banks;
  coordinate federal and private mortgage agencies (already secured).
rationale: The $125 million capital increase and RFC support held Land Bank foreclosures to about 1 percent, but
  'the mortgage situation has become more acute' and 'there must be more effective relief.'
statements:
- date: '1932-10-04'
  venue: Campaign address, Coliseum, Des Moines, Iowa
  phase: general
  doc: app-address-the-coliseum-des-moines-iowa
  quote: But further and more definitely than this, I shall propose to Congress at the next session that we further
    reorganize the Federal land banks, and that we give to them the resources and liberty of action, which they
    do not today possess, which may be necessary to enable them definitely and positively to expand in the refinancing
    of the farm-mortgage situation where it is necessary to give men who want to fight for it a chance to hold their
    homes.
- date: '1932-10-04'
  venue: Campaign address, Coliseum, Des Moines, Iowa
  phase: general
  doc: app-address-the-coliseum-des-moines-iowa
  quote: The character of the organization of the joint stock land banks whose business methods are not controlled
    by the Federal Farm Loan Board has resulted in unjust pressure for payments in some of those banks. The basis
    of that organization should be remedied.
