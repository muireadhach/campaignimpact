title: Transfer the principal industries — banking, natural resources, utilities — to social ownership by compensation,
  not confiscation
solution: '''Transfer of the principal industries of the country from private ownership and autocratic management
  to social ownership and democratic control,'' industry by industry, with planned and steady production; socialize
  banking, natural resources, basic industries and public utilities. The convention rejected ''confiscation'' 168–14
  on Thomas''s motion.'
rationale: Periodic breakdowns are inherent in unregulated private industry operated for profit; 'starvation amidst
  plenty'; the Socialist program is 'the cardinal demand of Socialism.'
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
