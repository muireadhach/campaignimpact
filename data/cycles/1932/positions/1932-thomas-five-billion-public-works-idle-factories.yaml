title: A $5 billion federal public-works program — roads, reforestation, slum clearance, workers' housing — and
  idle factories and land turned over to the unemployed
solution: Federal appropriation of $5,000,000,000 for public work and roads, reforestation, slum clearance and decent
  homes for workers, with states and cities; legislation turning over idle land, factories and equipment to unemployed
  workers to produce food, fuel and clothing (Hoopes amendment, carried 78–62).
rationale: '''To break the vicious circle of unemployment and depression''; a country that raised $15 billion for
  war can give a third of it ''for the preservation of life.'''
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
