  venue: Milwaukee Leader report of the Socialist convention platform session (May 23)
  phase: convention
  attribution: party_platform
  doc: loc-sn83045293-1932-05-23-ed1-p1
  quote: A plank demanding a federal ap propriation of $5,000,000,000 for im mediate relief for those in need to
