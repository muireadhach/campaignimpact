title: A $5 billion federal appropriation for immediate relief of those in need
solution: Federal appropriation of $5,000,000,000 for immediate relief to supplement state and local appropriations.
rationale: '''A country that is rich enough to provide $2,000,000,000 to help a few thousand bankers ... can surely
  not be heard to plead poverty when it is asked to provide food and work for 8,000,000 jobless workers''; ''every
  citizen willing to work has the right to live.'''
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
statements:
