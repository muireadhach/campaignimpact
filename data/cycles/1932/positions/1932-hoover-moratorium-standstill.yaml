title: The 1931 German moratorium and standstill agreements stemmed European collapse and will be built upon
solution: Defend the one-year intergovernmental debt moratorium of June 1931 and the standstill on German private
  debts as having 'stemmed the tide of collapse in Germany'; continue cooperation for foreign stability.
rationale: Europe's collapse struck the United States through gold withdrawals and lost markets; 'we have fought
  for stability in other countries whose failure would inevitably injure us.'
statements:
- date: '1932-08-11'
  venue: Address accepting the Republican nomination, Constitution Hall, Washington
  phase: general
  doc: app-address-accepting-the-republican-presidential-nomination
  quote: It is in accordance with these principles that in the face of the looming European crises we sought to
    change the trend of European economic degeneration by our proposals of the German moratorium and the standstill
    agreements on German private debts. We stemmed the tide of collapse in Germany and the consequent ruin of its
    people.
