title: Never recognize territory gained in violation of the peace pacts (the Stimson Doctrine)
solution: Maintain the doctrine, announced over Manchuria in January 1932 and endorsed by the League and the Western
  Hemisphere nations, that the United States will not recognize title to territory acquired in violation of the
  Kellogg Pact.
rationale: '''Public opinion made tangible and effective'' — sanction without force.'
statements:
- date: '1932-08-11'
  venue: Address accepting the Republican nomination, Constitution Hall, Washington
  phase: general
  doc: app-address-accepting-the-republican-presidential-nomination
  quote: I have projected a new doctrine into international affairs--the doctrine that we do not and never will
    recognize title to the possession of territory gained in violation of the peace pacts which were signed with
    us.
