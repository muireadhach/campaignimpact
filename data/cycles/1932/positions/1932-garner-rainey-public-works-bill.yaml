title: The Garner-Rainey $1.2 billion public-works bill — and a pledge to reintroduce it
solution: As Speaker, secured House passage (June 1932) of a $1,200 million public-works program covering 3,500
  projects, plus RFC loans to states; announced he would introduce it again in the next session.
rationale: Direct federal construction as unemployment relief; Hoover called it pork-barrel.
notes: Garner made almost no personal campaign statements; his positions are reconstructed from his House record
  as described by his opponent. Hoover's account of the bill's contents is broadly accurate; the 'pork' characterization
  is contested.
