title: The six-hour day and five-day week without reduction in wages
solution: Legislate a six-hour day and five-day week with no wage reduction, plus a comprehensive system of public
  employment agencies.
rationale: Labor-saving machinery 'increases unemployment and spreads misery' under capitalism; hours should fall
  'in keeping with the increased productivity of modern machinery.'
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
