title: Rigid federal penal laws against gangsters, racketeers and kidnappers; relentless war on narcotics
solution: Enact federal laws aiding the states against gangsters, racketeers and kidnappers; continue the drive
  against illicit narcotics strengthened by treaty.
rationale: The Lindbergh kidnapping (March 1932) and Prohibition-era racketeering made federal action popular.
statements:
- date: '1932-06-14'
  venue: Republican National Convention, Chicago (platform)
  phase: convention
  doc: app-republican-party-platform-1932
  quote: We favor the enactment of rigid penal laws that will aid the States in stamping out the activities of gangsters,
    racketeers and kidnappers. We commend the intensive and effective drive made upon these public enemies by President
    Hoover and pledge our party to further efforts to the same purpose.
  attribution: party_platform
- date: '1932-06-14'
  venue: Republican National Convention, Chicago (platform)
  phase: convention
  doc: app-republican-party-platform-1932
  quote: The Republican Party pledges itself to continue the present relentless warfare against the illicit narcotic
    traffic and the spread of the curse of drug addiction among our people.
  attribution: party_platform
