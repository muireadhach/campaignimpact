title: A long-range plan consolidating the federal government's scattered public-health and welfare agencies
solution: >
  Inaugurate "a definite long-range plan for dealing with all phases of public health and welfare" that are
  a proper federal concern, consolidating the "multiplicity of unrelated agencies," on the New York model.
rationale: Hit-or-miss agencies waste men and money; three Republican campaigns promised reorganization and did nothing.
