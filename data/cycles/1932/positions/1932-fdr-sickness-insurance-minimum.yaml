title: Sickness insurance as a "minimum requirement" alongside old-age and unemployment insurance
solution: Sickness insurance for industrial workers, named with old-age and unemployment insurance as minimum requirements; no mechanism given.
rationale: Workers "need ... a greater assurance of security"; social insurance is a floor, not a full program.
