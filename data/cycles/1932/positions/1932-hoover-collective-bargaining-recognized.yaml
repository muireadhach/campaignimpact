title: Collective bargaining by representatives of the employees' own choice, 'without the interference of any one'
solution: Recognize and approve collective bargaining between responsible representatives of employers and employees
  chosen without interference; continue Republican-origin labor laws (eight-hour law on government work, mediation,
  railroad safety).
rationale: Republican labor legislation 'have had and will continue to have the unswerving support of the party.'
notes: Language close to the Norris-La Guardia Act of March 1932, which Hoover signed.
