title: A national policy of planned land use — economic soil survey and retirement of marginal farmland
solution: >
  A federally initiated, federal-state economic soil survey (especially in the East) to map and classify
  land for crops, marginal use, or tree crops; retire poor land from cultivation (New York model: $10
  million voted, 200,000 acres bought and reforested); accompanying efforts to decentralize industry.
rationale: >
  The country already has more tilled land than it needs; cultivation of poor Eastern land depresses
  prices of better land's products and wastes public and private resources.
