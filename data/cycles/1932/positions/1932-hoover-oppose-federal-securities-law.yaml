title: No federal 'blue sky' law — securities regulation belongs to the states, and the President should not police
  booms
solution: Leave control of securities issues to the states (New York above all), where 'the full constitutional
  authority for that sort of action rests'; reject a federal securities board as unconstitutional, centralizing
  and unwanted; reject the idea that a President should 'tilt with a boom' or supervise municipal finance.
rationale: '''I am advised that this is not within the constitutional authority of the Federal Government''; a Washington
  board ''dealing out certificates as to issue of securities'' would be ''centralization of government beyond anything
  we have hitherto witnessed''; the Federal Reserve, not the President, was the Democrats'' own chosen instrument
  against panics.'
notes: The sharpest institutional contrast with Roosevelt's Columbus program; the Securities Act of 1933 and the
  SEC (1934) did what Hoover here calls unconstitutional.
statements:
- date: '1932-11-04'
  venue: Campaign address, St. Louis
  phase: general
  doc: app-address-st-louis-missouri
  quote: I am not disputing that many securities are issued which are dishonest and over which there should be a
    control. But, the full constitutional authority for that sort of action rests, of course, in the States, and
    I am advised that this is not within the constitutional authority of the Federal Government.
- date: '1932-11-04'
  venue: Campaign address, St. Louis
  phase: general
  doc: app-address-st-louis-missouri
  quote: In any event, his plan would be centralization of government beyond anything we have hitherto witnessed
    and does not seem to accord with the forgotten Democratic theory of State rights.
- date: '1932-11-04'
  venue: Campaign address, St. Louis
  phase: general
  doc: app-address-st-louis-missouri
  quote: Now, I have little taste for this proposal that the White House should be turned into a stock tipster's
    office. I earnestly object to the idea that such a form of dictatorship should ever be set up over the American
    people, even if they do get overoptimistic.
