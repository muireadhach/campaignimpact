title: Gradual Philippine independence — economic independence first, with duty-free sugar cut from 600,000 tons
  downward every year
solution: Oppose the Democratic Hawes-Hayes bill (9–17 year probation with duty-free sugar rising to 850,000 tons);
  instead freeze duty-free Philippine sugar at 600,000 tons and reduce it annually so the islands build economic
  independence before political independence.
rationale: The Philippines 'cannot in their own interest attain political independence until they have secured economic
  independence'; the Democratic plan hurts the American beet-sugar grower for years and then 'plunges the Philippines
  into ruin as the price of their liberty.'
statements:
- date: '1932-11-07'
  venue: Campaign address, Salt Lake City, Utah
  phase: general
  doc: app-address-salt-lake-city-utah
  quote: We say that they cannot in their own interest attain political independence until they have secured economic
    independence. They depend for their prosperity upon being within the tariff laws of the United States. We therefore
    say that their amount of duty-free sugar and of other commodities must not be increased at all, but on the contrary
    must start, in the case of sugar, at 600,000 tons and be reduced every year in order to gradually establish
    their economic independence.
  note: Statement to the press issued the same morning and read into the speech.
