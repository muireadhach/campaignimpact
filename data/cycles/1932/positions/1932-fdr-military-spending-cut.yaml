title: An adequate Army and Navy without a near-billion-dollar peacetime burden
solution: >
  Base the size of the Army and Navy on a fact survey of the existing establishments so that peacetime
  defense spending, "fast approaching a billion dollars annually," is reduced.
rationale: Peacetime military expenditure is part of the excessive cost of government.
statements:
  - date: 1932-06-27
    venue: Democratic National Convention, Chicago (platform)
    phase: convention
    attribution: party_platform
    doc: app-1932-democratic-party-platform
    quote: "We advocate a Navy and an Army adequate for national defense, based on a survey of all facts affecting the existing establishments, that the people in time of peace may not be burdened by an expenditure fast approaching a billion dollars annually."
  - date: 1932-07-02
    venue: Acceptance address, Democratic National Convention, Chicago
    phase: convention
    attribution: candidate_direct
    doc: app-address-accepting-the-presidential-nomination-the-democratic-national-convention-chicago-1
    quote: "That admirable document, the platform which you have adopted, is clear. I accept it 100 percent."
    note: Blanket endorsement of every plank.
