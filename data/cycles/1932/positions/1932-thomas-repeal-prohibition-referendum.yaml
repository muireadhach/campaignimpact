title: Repeal the Eighteenth Amendment — the candidate preferring a binding national referendum
solution: Platform plank for repeal (carried 81–71, then 84–77); Thomas personally favored a national referendum
  to which parties would pledge themselves, and would vote for repeal in it; a Hoan–Broun–Ameringer proposal for
  government ownership of the liquor industry with state local option was also offered.
rationale: The party should 'take a definite, courageous stand where the two old parties are dodging' (Broun).
notes: 'Evidence B: the platform text is archived only as contemporary newspaper OCR (Milwaukee Leader, the Socialist
  daily) and Levinson''s New Leader summary, not the official platform document.'
