name: Huey P. Long
born: '1893-08-30'
died: '1935-09-10'
parties:
- Democratic
offices:
- office: Governor of Louisiana
  start: 1928
  end: 1932
- office: U.S. Senator from Louisiana
  start: 1932
  end: 1935
summary: Louisiana governor and senator; founder of the Share Our Wealth Society (1934); widely expected to run
  as a third-party candidate in 1936 until assassinated in September 1935.
